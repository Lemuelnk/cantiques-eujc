<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b2b24" media="(prefers-color-scheme: dark)">
  <title>Cantiques — Cantiques EUJC</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="charte.css?v=58">
  <link rel="stylesheet" href="fonts.css?v=58">  <script>
    /* Anti-FOUC : applique le thème + police avant tout rendu */
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('cantiques-eujc-preferences') || '{}');
        var t = p.theme || 'system';
        var eff = t === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t;
        document.documentElement.setAttribute('data-theme', eff);
        if (eff === 'dark') {
          document.documentElement.classList.add('theme-dark');
          document.addEventListener('DOMContentLoaded', function(){
            if (document.body) document.body.classList.add('theme-dark');
          }, { once: true });
        }
        if (p.textScale) document.documentElement.style.setProperty('--text-scale', p.textScale);
        var fonts = {'system':'var(--font-system)','open-sans':'var(--font-open-sans)','lora':'var(--font-lora)','atkinson':'var(--font-atkinson)'};
        if (p.font && fonts[p.font]) {
          document.documentElement.style.setProperty('--font-body', fonts[p.font]);
          document.documentElement.style.setProperty('--font-heading', fonts[p.font]);
        }
      } catch(e) {}
    })();
  </script>

  <link rel="stylesheet" href="cantiques.css?v=58">
  <link rel="stylesheet" href="bottom-nav.css?v=58">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="report-fab.css?v=58">
</head>

<body data-report-scope="cantiques">
  <main class="hymns-page">

    <header class="hymns-header">
      <button class="icon-button" id="back-button" aria-label="Retour">
        <i data-lucide="arrow-left"></i>
      </button>

      <div class="header-info">
        <h1 id="category-title">Leçon 1 — Création</h1>
        <p id="category-count">12 cantiques</p>
      </div>

      <div class="header-actions">
        <button class="icon-button" id="sort-button" aria-label="Trier la liste">
          <i data-lucide="arrow-up-down"></i>
        </button>

        <button class="icon-button" id="search-button" aria-label="Rechercher">
          <i data-lucide="search"></i>
        </button>
      </div>
    </header>

    <section class="search-panel" id="search-panel" hidden>
      <div class="search-input-wrapper">
        <i data-lucide="search"></i>
        <input
          type="search"
          id="hymn-search"
          placeholder="Rechercher un cantique..."
          autocomplete="off"
        >
        <button id="clear-search" class="clear-button" aria-label="Effacer">
          <i data-lucide="x"></i>
        </button>
      </div>
    </section>

    <section class="hymns-list" id="hymns-list" aria-live="polite"></section>

    <div class="empty-state" id="empty-state" hidden>
      <i data-lucide="search-x"></i>
      <h2>Aucun cantique trouvé</h2>
      <p>Essayez avec un autre terme de recherche.</p>
    </div>

  </main>

  <!-- SHARED BOTTOM NAVIGATION -->
  <div id="bottom-nav"></div>

  <div class="sort-sheet-backdrop" id="sort-backdrop" hidden></div>

  <section class="sort-sheet" id="sort-sheet" aria-hidden="true">
    <div class="sort-handle"></div>

    <div class="sort-header">
      <h2>Trier la liste</h2>

      <button class="icon-button" id="close-sort" aria-label="Fermer">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="sort-options">

      <button class="sort-option active" data-sort="source">
        <span>
          <strong>Ordre de la source</strong>
          <small>Ordre original des cantiques</small>
        </span>
        <i data-lucide="check"></i>
      </button>

      <button class="sort-option" data-sort="alphabetical">
        <span>
          <strong>Alphabétique</strong>
          <small>A → Z</small>
        </span>
        <i data-lucide="check"></i>
      </button>

      <button class="sort-option" data-sort="favorites">
        <span>
          <strong>Favoris en premier</strong>
          <small>Les cantiques favoris apparaissent en tête</small>
        </span>
        <i data-lucide="check"></i>
      </button>

    </div>
  </section>

  <script src="bottom-nav.js?v=58"></script>
  <script src="canonical-data.js?v=58"></script>
  <script src="storage.js?v=58"></script>
  <script src="cantiques.js?v=58"></script>
  <script>
    lucide.createIcons();
  </script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
<script src="sw-register.js?v=58"></script>
  <script src="report-fab.js?v=58"></script>
  <script src="preferences.js?v=58"></script>
</body>
</html>
