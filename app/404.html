<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2b24">
  <title>Page introuvable — Cantiques EUJC</title>
  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cantiques EUJC">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Open Sans', sans-serif;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(45, 95, 79, 0.45) 0%, transparent 60%),
        linear-gradient(165deg, #14392e 0%, #0b2b24 45%, #081f19 100%);
      color: #f5f0e6;
      text-align: center;
    }
    .wrap { max-width: 400px; }
    .code {
      font-family: 'Lora', Georgia, serif;
      font-size: 96px;
      font-weight: 700;
      background: linear-gradient(180deg, #e4c37f 0%, #b8935a 55%, #f0dfb5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: rgba(245, 240, 230, 0.7);
      margin-bottom: 28px;
    }
    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 12px;
      background: #b8935a;
      color: #14392e;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform 120ms ease;
    }
    a:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <a href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
