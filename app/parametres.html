<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b2b24" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Paramètres — Cantiques EUJC">
  <title>Paramètres — Cantiques EUJC</title>

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cantiques EUJC">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="charte.css?v=200">
  <link rel="stylesheet" href="fonts.css?v=200">
  <link rel="stylesheet" href="style.css?v=200">
  <link rel="stylesheet" href="bottom-nav.css?v=200">
  <link rel="stylesheet" href="parametres.css?v=200">

  <script>
    /* Anti-FOUC : applique le thème + police avant tout rendu */
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('cantiques-eujc-preferences') || '{}');
        var t = p.theme || 'system';
        var eff = t === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t;
        document.documentElement.setAttribute('data-theme', eff);
        if (eff === 'dark') {
          document.documentElement.classList.add('theme-dark');
          document.addEventListener('DOMContentLoaded', function(){
            if (document.body) document.body.classList.add('theme-dark');
          }, { once: true });
        }
        if (p.textScale) document.documentElement.style.setProperty('--text-scale', p.textScale);
        var fonts = {'system':'var(--font-system)','open-sans':'var(--font-open-sans)','lora':'var(--font-lora)','atkinson':'var(--font-atkinson)'};
        if (p.font && fonts[p.font]) {
          document.documentElement.style.setProperty('--font-body', fonts[p.font]);
          document.documentElement.style.setProperty('--font-heading', fonts[p.font]);
        }
      } catch(e) {}
    })();
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <meta name="robots" content="noindex, follow">
</head>
<body>

  <main class="settings-page">

    <header class="settings-header">
      <button class="icon-button" id="back-button" aria-label="Retour" type="button">
        <i data-lucide="arrow-left"></i>
      </button>

      <div class="settings-header-title">
        <h1>Paramètres</h1>
      </div>

      <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <section class="settings-content">

      <!-- APPARENCE -->
      <h2 class="settings-section-title">Apparence</h2>

      <div class="settings-card">
        <div class="settings-row settings-row-column">
          <span class="settings-label">Thème</span>
          <div class="theme-toggle" role="radiogroup" aria-label="Thème">
            <button type="button" class="theme-btn" data-theme="light" role="radio">
              <i data-lucide="sun"></i>
              <span>Clair</span>
            </button>
            <button type="button" class="theme-btn" data-theme="dark" role="radio">
              <i data-lucide="moon"></i>
              <span>Sombre</span>
            </button>
            <button type="button" class="theme-btn" data-theme="system" role="radio">
              <i data-lucide="smartphone"></i>
              <span>Système</span>
            </button>
          </div>
        </div>
      </div>

      <div class="settings-card">
        <div class="settings-row settings-row-column">
          <span class="settings-label">Taille du texte</span>
          <div class="text-size-row">
            <span class="text-size-a">Aa</span>
            <div class="text-size-slider-wrap">
              <input type="range" id="text-size-slider" min="0" max="3" step="1" value="1">
              <div class="text-size-labels">
                <span data-index="0">S</span>
                <span data-index="1">M</span>
                <span data-index="2">L</span>
                <span data-index="3">XL</span>
              </div>
            </div>
            <span class="text-size-a text-size-a-large">Aa</span>
          </div>
        </div>
      </div>

      <div class="settings-card">
        <div class="settings-row settings-row-column">
          <span class="settings-label">Police de lecture</span>
          <div class="font-list" role="radiogroup" aria-label="Police">
            <button type="button" class="font-option" data-font="system" role="radio">
              <span class="font-option-name">Système</span>
              <span class="font-option-sample font-system">Mungu ni mwema</span>
            </button>
            <button type="button" class="font-option" data-font="open-sans" role="radio">
              <span class="font-option-name">Open Sans</span>
              <span class="font-option-sample font-open-sans">Mungu ni mwema</span>
            </button>
            <button type="button" class="font-option" data-font="lora" role="radio">
              <span class="font-option-name">Lora</span>
              <span class="font-option-sample font-lora">Mungu ni mwema</span>
            </button>
            <button type="button" class="font-option" data-font="atkinson" role="radio">
              <span class="font-option-name">Atkinson</span>
              <span class="font-option-sample font-atkinson">Mungu ni mwema</span>
            </button>
          </div>
        </div>
      </div>

      <!-- CONTENU -->
      <h2 class="settings-section-title">Contenu</h2>

      <a class="settings-card settings-link" href="favoris.html">
        <div class="settings-row">
          <div class="settings-row-icon">
            <i data-lucide="heart"></i>
          </div>
          <span class="settings-label">Mes favoris</span>
          <i data-lucide="chevron-right" class="settings-arrow"></i>
        </div>
      </a>

      <a class="settings-card settings-link" href="historique.html">
        <div class="settings-row">
          <div class="settings-row-icon">
            <i data-lucide="clock"></i>
          </div>
          <span class="settings-label">Derniers consultés</span>
          <i data-lucide="chevron-right" class="settings-arrow"></i>
        </div>
      </a>

      <!-- APPLICATION -->
      <h2 class="settings-section-title">Application</h2>

      <button type="button" class="settings-card settings-link" id="btn-share-app">
        <div class="settings-row">
          <div class="settings-row-icon">
            <i data-lucide="share-2"></i>
          </div>
          <span class="settings-label">Partager l'application</span>
          <i data-lucide="chevron-right" class="settings-arrow"></i>
        </div>
      </button>

      <a class="settings-card settings-link" href="signaler.html?scope=global">
        <div class="settings-row">
          <div class="settings-row-icon">
            <i data-lucide="flag"></i>
          </div>
          <span class="settings-label">Signaler un problème</span>
          <i data-lucide="chevron-right" class="settings-arrow"></i>
        </div>
      </a>

      <a class="settings-card settings-link" href="apropos.html">
        <div class="settings-row">
          <div class="settings-row-icon">
            <i data-lucide="info"></i>
          </div>
          <span class="settings-label">À propos</span>
          <i data-lucide="chevron-right" class="settings-arrow"></i>
        </div>
      </a>

      <!-- VERSION -->
      <p class="settings-version" id="settings-version">Cantiques EUJC — v1.0.0</p>

    </section>
  </main>

  <div id="bottom-nav"></div>

  <script src="bottom-nav.js?v=200"></script>
  <script src="preferences.js?v=200"></script>
  <script src="parametres.js?v=200"></script>
  <script src="sw-register.js?v=200"></script>
</body>
</html>
