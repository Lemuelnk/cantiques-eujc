<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d2e22">
  <meta name="description" content="Cantique — Cantiques EUJC">
  <title>Cantique — Cantiques EUJC</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=31">
  <link rel="stylesheet" href="cantique.css?v=31">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <main class="hymn-detail-page" id="hymn-page">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="hymn-detail-header">
      <button
        class="icon-button"
        id="back-button"
        aria-label="Retour"
        type="button"
      >
        <i data-lucide="arrow-left"></i>
      </button>

      <div class="header-actions">
        <button
          class="icon-button"
          id="btn-favorite"
          aria-label="Ajouter aux favoris"
          type="button"
        >
          <i data-lucide="star"></i>
        </button>

        <button
          class="icon-button"
          id="btn-share"
          aria-label="Partager"
          type="button"
        >
          <i data-lucide="share-2"></i>
        </button>

        <button
          class="icon-button"
          id="btn-menu"
          aria-label="Plus d'options"
          type="button"
        >
          <i data-lucide="more-vertical"></i>
        </button>
      </div>
    </header>

    <!-- =========================
         CONTENU (injecté par JS)
    ========================== -->
    <section id="hymn-detail" aria-live="polite">
      <div class="detail-loading">Chargement du cantique…</div>
    </section>

    <!-- BARRE "SIGNALER" (dans main pour padding) -->
    <div class="report-cta" id="report-cta" hidden>
      <button type="button" class="report-cta-btn" id="report-cta-btn">
        <i data-lucide="flag"></i>
        <span>Une erreur dans ce cantique ? Signalez-la</span>
      </button>
    </div>

  </main>

  <!-- =========================
       BARRE D'ACTION BAS
  ========================== -->
  <div class="hymn-action-bar" id="action-bar" hidden>
    <button class="action-btn" id="btn-prev" type="button" aria-label="Cantique précédent">
      <i data-lucide="skip-back"></i>
      <span>Précédent</span>
    </button>

    <button class="action-btn" id="btn-reading-mode" type="button">
      <i data-lucide="book-open"></i>
      <span>Lecture</span>
    </button>

    <button class="action-btn" id="btn-text-size" type="button">
      <i data-lucide="type"></i>
      <span>Texte</span>
    </button>

    <button class="action-btn action-btn-primary" id="btn-next" type="button">
      <i data-lucide="skip-forward"></i>
      <span>Suivant</span>
    </button>
  </div>

  <!-- Menu contextuel (caché par défaut) -->
  <div class="hymn-menu-backdrop" id="menu-backdrop" hidden></div>
  <div class="hymn-menu-sheet" id="menu-sheet" hidden>
    <button class="menu-item" id="menu-copy" type="button">
      <i data-lucide="copy"></i>
      <span>Copier les paroles</span>
    </button>
    <button class="menu-item" id="menu-open-category" type="button">
      <i data-lucide="folder-open"></i>
      <span>Voir la catégorie</span>
    </button>
    <button class="menu-item" id="menu-signaler" type="button">
      <i data-lucide="flag"></i>
      <span>Signaler un problème</span>
    </button>
    <button class="menu-item" id="menu-close" type="button">
      <i data-lucide="x"></i>
      <span>Fermer</span>
    </button>
  </div>


  <script src="canonical-data.js?v=31"></script>
  <script src="storage.js?v=31"></script>
  <script src="cantique.js?v=31"></script>
  <script src="sw-register.js?v=31"></script>
</body>
</html>
