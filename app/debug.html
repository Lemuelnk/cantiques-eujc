<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug — Cantiques EUJC</title>
<style>
  body { font-family: monospace; padding: 16px; background: #111; color: #0f0; font-size: 14px; }
  h1 { color: #ff0; font-size: 18px; }
  h2 { color: #0ff; font-size: 15px; margin-top: 20px; }
  .ok { color: #0f0; }
  .ko { color: #f44; }
  button { padding: 10px 16px; margin: 4px; font-size: 15px; }
  pre { background: #222; padding: 8px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
  <h1>🔧 Debug Cantiques EUJC</h1>

  <h2>1. Fonctions storage.js</h2>
  <div id="check-fns">Chargement…</div>

  <h2>2. localStorage</h2>
  <pre id="check-ls">Chargement…</pre>

  <h2>3. Tests</h2>
  <button id="btn-fav">+ Favori test</button>
  <button id="btn-rec">+ Récent test</button>
  <button id="btn-refresh">Rafraîchir</button>
  <button id="btn-clear-fav">Vider favoris</button>
  <button id="btn-clear-rec">Vider récents</button>

  <h2>4. Journal</h2>
  <pre id="result">(vide)</pre>

  <script src="storage.js?v=4"></script>
  <script>
    function afficherFns() {
      const fns = ['getRecents','addRecent','getFavorites','isFavorite','toggleFavorite','clearFavorites','clearRecents'];
      document.getElementById('check-fns').innerHTML = fns.map(fn =>
        '<div>' + fn + ' : ' + (typeof window[fn] === 'function'
          ? '<span class="ok">✅ function</span>'
          : '<span class="ko">❌ ' + typeof window[fn] + '</span>') + '</div>'
      ).join('');
    }
    function afficherLS() {
      const fav = localStorage.getItem('cantiques-eujc-favoris');
      const rec = localStorage.getItem('cantiques-eujc-recents');
      document.getElementById('check-ls').textContent =
        'fav : ' + (fav || '(vide)') + '\n\nrec : ' + (rec || '(vide)');
    }
    function log(msg) {
      const el = document.getElementById('result');
      el.textContent = (el.textContent === '(vide)' ? '' : el.textContent) + msg + '\n';
    }
    document.getElementById('btn-fav').onclick = () => {
      if (typeof toggleFavorite !== 'function') { log('❌ toggleFavorite absent'); return; }
      const r = toggleFavorite('test-' + Date.now(), 'test-cat');
      log('toggleFavorite → ' + r);
      afficherLS();
    };
    document.getElementById('btn-rec').onclick = () => {
      if (typeof addRecent !== 'function') { log('❌ addRecent absent'); return; }
      addRecent('test-' + Date.now(), 'test-cat');
      log('addRecent OK');
      afficherLS();
    };
    document.getElementById('btn-refresh').onclick = () => {
      afficherFns(); afficherLS(); log('-- rafraîchi --');
    };
    document.getElementById('btn-clear-fav').onclick = () => {
      if (typeof clearFavorites !== 'function') { log('❌'); return; }
      clearFavorites(); log('clearFavorites OK'); afficherLS();
    };
    document.getElementById('btn-clear-rec').onclick = () => {
      if (typeof clearRecents !== 'function') { log('❌'); return; }
      clearRecents(); log('clearRecents OK'); afficherLS();
    };
    afficherFns();
    afficherLS();
  </script>
<script src="sw-register.js?v=4"></script>
</body>
</html>
