  <link rel="stylesheet" href="fonts.css?v=407">  <script>
    /* Anti-FOUC : applique le thème + police avant tout rendu */
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('cantiques-eujc-preferences') || '{}');
        var t = p.theme || 'system';
        var eff = t === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t;
        document.documentElement.setAttribute('data-theme', eff);
        if (eff === 'dark') {
          document.documentElement.classList.add('theme-dark');
          document.addEventListener('DOMContentLoaded', function(){
            if (document.body) document.body.classList.add('theme-dark');
          }, { once: true });
        }
        if (p.textScale) document.documentElement.style.setProperty('--text-scale', p.textScale);
        var fonts = {'system':'var(--font-system)','open-sans':'var(--font-open-sans)','lora':'var(--font-lora)','atkinson':'var(--font-atkinson)'};
        if (p.font && fonts[p.font]) {
          document.documentElement.style.setProperty('--font-body', fonts[p.font]);
          document.documentElement.style.setProperty('--font-heading', fonts[p.font]);
        }
      } catch(e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css?v=407">
  <link rel="stylesheet" href="bottom-nav.css?v=407">
  <link rel="stylesheet" href="cantiques.css?v=407">
  <link rel="stylesheet" href="historique.css?v=407">

  <script src="https://unpkg.com/lucide@latest"></script>
  <meta name="robots" content="noindex, follow">
</head>
<body>

  <main class="history-page">

    <header class="history-header">
      <button class="back-button" id="back-button" aria-label="Retour" type="button">
        <i data-lucide="arrow-left"></i>
      </button>

      <div class="history-header-title">
        <h1>Historique</h1>
        <span id="history-count">Chargement…</span>
      </div>

      <button class="clear-btn" id="clear-history" type="button" hidden>
        Vider
      </button>
    </header>

    <section class="history-content">
      <div class="history-list" id="history-list"></div>

      <div class="history-empty" id="history-empty" hidden>
        <div class="empty-icon"><i data-lucide="clock"></i></div>
        <h2>Aucun cantique consulté</h2>
        <p>Vos cantiques récemment ouverts apparaîtront ici.</p>
      </div>

      <div class="history-loading" id="history-loading">
        Chargement de l'historique…
      </div>
    </section>
  </main>

  <div id="bottom-nav"></div>

</body>
