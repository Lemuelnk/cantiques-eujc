<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b2b24" media="(prefers-color-scheme: dark)">

  <title>Cantiques EUJC</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="charte.css?v=66">
  <link rel="stylesheet" href="fonts.css?v=66">  <script>
    /* Anti-FOUC : applique le thème + police avant tout rendu */
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('cantiques-eujc-preferences') || '{}');
        var t = p.theme || 'system';
        var eff = t === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t;
        document.documentElement.setAttribute('data-theme', eff);
        if (eff === 'dark') {
          document.documentElement.classList.add('theme-dark');
          document.addEventListener('DOMContentLoaded', function(){
            if (document.body) document.body.classList.add('theme-dark');
          }, { once: true });
        }
        if (p.textScale) document.documentElement.style.setProperty('--text-scale', p.textScale);
        var fonts = {'system':'var(--font-system)','open-sans':'var(--font-open-sans)','lora':'var(--font-lora)','atkinson':'var(--font-atkinson)'};
        if (p.font && fonts[p.font]) {
          document.documentElement.style.setProperty('--font-body', fonts[p.font]);
          document.documentElement.style.setProperty('--font-heading', fonts[p.font]);
        }
      } catch(e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css?v=66">
  <link rel="stylesheet" href="bottom-nav.css?v=66">

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div id="app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="app-header">

      <div class="brand-mini">
        <div class="brand-mark" aria-hidden="true">
          <i data-lucide="sparkles"></i>
        </div>

        <span>Cantiques EUJC</span>
      </div>

      <div class="header-actions">

        <button
          class="icon-button"
          id="btn-favoris"
          aria-label="Mes favoris"
          type="button"
        >
          <i data-lucide="star"></i>
        </button>

        <button
          class="icon-button"
          id="btn-parametres"
          aria-label="Paramètres"
          type="button"
        >
          <i data-lucide="settings"></i>
        </button>

      </div>

    </header>


    <!-- =========================
         HOME
    ========================== -->
    <main class="home">

      <!-- Welcome -->
      <section class="welcome">
        <p class="eyebrow">CANTIQUES EUJC</p>

        <h1>
          Bonjour
          <span aria-hidden="true">👋</span>
        </h1>

        <p class="welcome-text">
          Que souhaitez-vous<br>
          chanter aujourd’hui ?
        </p>
      </section>


      <!-- Search -->
      <section class="search-section">
        <label class="search-box" for="recherche">

          <span class="search-icon" aria-hidden="true">
            <i data-lucide="search"></i>
          </span>

          <input
            id="recherche"
            type="search"
            placeholder="Rechercher un cantique…"
            autocomplete="off"
          >

        </label>
      </section>


      <!-- Quick access -->
      <section class="quick-section">

        <div class="section-heading">
          <h2>Accès rapides</h2>
        </div>

        <div class="quick-grid">

          <!-- Leçons -->
          <button
            class="quick-card quick-card-green"
            data-action="lecons"
          >
            <span class="quick-icon" aria-hidden="true">
              <i data-lucide="book-open"></i>
            </span>

            <span>
              <strong>Cantiques</strong>
              <small>du Chemin</small>
            </span>

            <span class="quick-arrow" aria-hidden="true">
              <i data-lucide="chevron-right"></i>
            </span>
          </button>


          <!-- Dimanche -->
          <button
            class="quick-card quick-card-gold"
            data-action="dimanche"
          >
            <span class="quick-icon" aria-hidden="true">
              <i data-lucide="calendar-days"></i>
            </span>

            <span>
              <strong>Cantiques</strong>
              <small>du Dimanche</small>
            </span>

            <span class="quick-arrow" aria-hidden="true">
              <i data-lucide="chevron-right"></i>
            </span>
          </button>


          <!-- Prière -->
          <button
            class="quick-card quick-card-wide"
            data-action="priere"
          >
            <span class="quick-icon" aria-hidden="true">
              <i data-lucide="flame"></i>
            </span>

            <span>
              <strong>Cantiques de prière</strong>
            </span>

            <span class="quick-arrow" aria-hidden="true">
              <i data-lucide="chevron-right"></i>
            </span>
          </button>

        </div>
      </section>


      <!-- Recent -->
      <section class="recent-section">

        <div class="section-heading section-heading-row">
          <h2>Récemment consultés</h2>

          <button
            id="voir-tout"
            class="text-button"
          >
            Voir tout
          </button>
        </div>

        <div
          id="recents"
          class="recent-list"
        ></div>

      </section>

    </main>


    <!-- SHARED BOTTOM NAVIGATION -->
    <div id="bottom-nav"></div>

  </div>


  <!-- Application -->
  <script src="bottom-nav.js?v=66"></script>
  <script src="canonical-data.js?v=66"></script>
  <script src="storage.js?v=66"></script>
  <script src="app.js?v=66"></script>

  <!-- Lucide -->
  <script>
    lucide.createIcons();
  </script>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
<script src="sw-register.js?v=66"></script>
  <script src="preferences.js?v=66"></script>
  <script>
    /* DEBUG TEMPORAIRE */
    setTimeout(function() {
      var accueil = document.querySelector('[data-nav="accueil"]');
      var page = window.location.pathname.split('/').pop() || 'index.html';
      var activeItems = document.querySelectorAll('.nav-item.active');
      var activeNames = Array.from(activeItems).map(function(el) { return el.dataset.nav; }).join(',');
      document.title = 'dbg | page=' + page + ' | active=[' + activeNames + '] | accueil=' + (accueil ? accueil.classList.contains('active') : 'NULL');
    }, 500);
  </script>
</body>
</html>
