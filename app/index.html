<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#001a17">
  <title>Cantiques EUJC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <div class="app-shell">

    <!-- Header -->
    <header class="app-header">
      <button class="icon-button" type="button" aria-label="Retour">
        <i data-lucide="arrow-left"></i>
      </button>

      <div class="header-title">
        <span>Cantiques</span>
        <strong>de prière</strong>
      </div>

      <button class="icon-button" type="button" aria-label="Paramètres">
        <i data-lucide="settings"></i>
      </button>
    </header>

    <!-- Main -->
    <main class="page-content">

      <section class="section-intro">
        <span class="eyebrow">CANTIQUES EUJC</span>

        <h1>
          Cantiques<br>
          de prière
        </h1>

        <p>
          Retrouvez les cantiques consacrés à la prière,
          à l’invocation et au combat spirituel.
        </p>
      </section>

      <!-- Categories -->
      <section class="category-section">

        <button class="category-card" type="button">
          <div class="category-icon">
            <i data-lucide="heart-handshake"></i>
          </div>

          <div class="category-content">
            <span class="category-label">01</span>
            <h2>Cantiques de miséricorde</h2>
            <p>Chants de miséricorde</p>
          </div>

          <i class="category-arrow" data-lucide="chevron-right"></i>
        </button>

        <button class="category-card" type="button">
          <div class="category-icon">
            <i data-lucide="hand"></i>
          </div>

          <div class="category-content">
            <span class="category-label">02</span>
            <h2>Cantiques d’invocation</h2>
            <p>Chants d’invocation</p>
          </div>

          <i class="category-arrow" data-lucide="chevron-right"></i>
        </button>

        <button class="category-card" type="button">
          <div class="category-icon">
            <i data-lucide="hands-praying"></i>
          </div>

          <div class="category-content">
            <span class="category-label">03</span>
            <h2>Cantiques de prière</h2>
            <p>Section générale</p>
          </div>

          <i class="category-arrow" data-lucide="chevron-right"></i>
        </button>

        <button class="category-card" type="button">
          <div class="category-icon">
            <i data-lucide="swords"></i>
          </div>

          <div class="category-content">
            <span class="category-label">04</span>
            <h2>Cantiques de bataille</h2>
            <p>Chants de bataille</p>
          </div>

          <i class="category-arrow" data-lucide="chevron-right"></i>
        </button>

      </section>

    </main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" aria-label="Navigation principale">

      <button class="nav-item" type="button">
        <i data-lucide="house"></i>
        <span>Accueil</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="search"></i>
        <span>Recherche</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="library"></i>
        <span>Bibliothèque</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="ellipsis"></i>
        <span>Plus</span>
      </button>

    </nav>

  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
