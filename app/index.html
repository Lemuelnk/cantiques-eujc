  <link rel="stylesheet" href="fonts.css?v=402">  <script>
    /* Anti-FOUC : applique le thème + police avant tout rendu */
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('cantiques-eujc-preferences') || '{}');
        var t = p.theme || 'system';
        var eff = t === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t;
        document.documentElement.setAttribute('data-theme', eff);
        if (eff === 'dark') {
          document.documentElement.classList.add('theme-dark');
          document.addEventListener('DOMContentLoaded', function(){
            if (document.body) document.body.classList.add('theme-dark');
          }, { once: true });
        }
        if (p.textScale) document.documentElement.style.setProperty('--text-scale', p.textScale);
        var fonts = {'system':'var(--font-system)','open-sans':'var(--font-open-sans)','lora':'var(--font-lora)','atkinson':'var(--font-atkinson)'};
        if (p.font && fonts[p.font]) {
          document.documentElement.style.setProperty('--font-body', fonts[p.font]);
          document.documentElement.style.setProperty('--font-heading', fonts[p.font]);
        }
      } catch(e) {}
    })();
  </script>

<body>
  <div id="app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="app-header">

      <div class="brand-mini">
        <img
          class="brand-logo"
          src="assets/logo/logo-gold.png"
          alt=""
          aria-hidden="true"
        >
        <span>Cantiques EUJC</span>
      </div>

      <div class="header-actions">

        <button
          class="icon-button"
          id="btn-favoris"
          aria-label="Mes favoris"
          type="button"
        >
          <i data-lucide="heart"></i>
        </button>

        <button
          class="icon-button"
          id="btn-parametres"
          aria-label="Paramètres"
          type="button"
        >
          <i data-lucide="settings"></i>
        </button>

      </div>

    </header>


    <!-- =========================
         HOME
    ========================== -->
    <main class="home">

      <!-- Welcome -->
      <section class="welcome">
        <p class="eyebrow">CANTIQUES EUJC</p>

        <h1>
          Bonjour
          <span aria-hidden="true">👋</span>
        </h1>

        <p class="welcome-text">
          Que souhaitez-vous<br>
          chanter aujourd’hui ?
        </p>
      </section>


      <!-- Search -->
      <section class="search-section">
        <label class="search-box" for="recherche">

          <span class="search-icon" aria-hidden="true">
            <i data-lucide="search"></i>
          </span>

          <input
            id="recherche"
            type="search"
            placeholder="Rechercher un cantique…"
            autocomplete="off"
          >

        </label>
      </section>


      <!-- Quick access -->
      <section class="quick-section">

        <div class="section-heading section-heading-row">
          <h2>Accès rapides</h2>
          <a class="text-button" href="categories.html">Toutes les catégories</a>
        </div>

        <div class="quick-grid">

          <!-- Leçons -->
          <a
            class="quick-card quick-card-green"
            href="lessons.html"
          >
            <span class="quick-icon" aria-hidden="true">
              <i data-lucide="book-open"></i>
            </span>

            <span>
              <strong>Cantiques</strong>
              <small>du Chemin</small>
            </span>

            <span class="quick-arrow" aria-hidden="true">
              <i data-lucide="chevron-right"></i>
            </span>
          </a>


          <!-- Dimanche -->
          <a
            class="quick-card quick-card-gold"
            href="dimanche.html"
          >
            <span class="quick-icon" aria-hidden="true">
              <i data-lucide="calendar-days"></i>
            </span>

            <span>
              <strong>Cantiques</strong>
              <small>du Dimanche</small>
            </span>

            <span class="quick-arrow" aria-hidden="true">
              <i data-lucide="chevron-right"></i>
            </span>
          </a>


          <!-- Prière -->
          <a
            class="quick-card quick-card-wide"
            href="priere.html"
          >
            <span class="quick-icon" aria-hidden="true">
              <i data-lucide="flame"></i>
            </span>

            <span>
              <strong>Cantiques de prière</strong>
            </span>

            <span class="quick-arrow" aria-hidden="true">
              <i data-lucide="chevron-right"></i>
            </span>
          </a>


          <!-- Cantiques à classer -->
          <a
            class="quick-card quick-card-wide"
            href="a-classer.html"
          >
            <span class="quick-icon" aria-hidden="true">
              <i data-lucide="folder-open"></i>
            </span>

            <span>
              <strong>Cantiques à classer</strong>
            </span>

            <span class="quick-arrow" aria-hidden="true">
              <i data-lucide="chevron-right"></i>
            </span>
          </a>

        </div>
      </section>


      <!-- Recent -->
      <section class="recent-section">

        <div class="section-heading section-heading-row">
          <h2>Récemment consultés</h2>

          <button
            id="voir-tout"
            class="text-button"
          >
            Voir tout
          </button>
        </div>

        <div
          id="recents"
          class="recent-list"
        ></div>

      </section>

    </main>
