<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>Cantiques EUJC</title>
  
  <style>
:root {
  --bleu: #0a2540;
  --bleu-clair: #1e3a5f;
  --or: #d4a017;
  --fond: #f7f8fa;
  --texte: #1a1a1a;
  --gris: #666;
  --bord: #ddd;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--fond);
  color: var(--texte);
  -webkit-tap-highlight-color: transparent;
}

/* Barre du haut */
.topbar {
  position: sticky;
  top: 0;
  background: var(--bleu);
  color: #fff;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  z-index: 10;
}

.topbar h1 {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.btn-retour {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 1.4rem;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
}

/* Recherche */
.barre-recherche {
  padding: 14px 16px 8px;
}

.barre-recherche input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--bord);
  border-radius: 10px;
  font-size: 1rem;
  background: #fff;
}

.barre-recherche input:focus {
  outline: none;
  border-color: var(--or);
}

/* Filtres */
.filtres {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
}

.filtres select {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--bord);
  border-radius: 8px;
  background: #fff;
  font-size: 0.9rem;
}

/* Liste */
.liste {
  list-style: none;
  padding: 0 12px 80px;
}

.liste li {
  background: #fff;
  margin-bottom: 8px;
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  border-left: 4px solid var(--or);
  transition: background 0.15s;
}

.liste li:active {
  background: #eef2f7;
}

.liste .titre {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 4px;
}

.liste .meta {
  font-size: 0.8rem;
  color: var(--gris);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.liste .badge {
  background: var(--bleu-clair);
  color: #fff;
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 0.7rem;
}

.vide {
  text-align: center;
  color: var(--gris);
  padding: 40px 20px;
}

/* Fiche cantique */
#vue-cantique {
  padding: 16px 16px 80px;
}

#contenu-cantique h2 {
  font-size: 1.3rem;
  margin-bottom: 6px;
  color: var(--bleu);
}

#contenu-cantique .meta-cantique {
  font-size: 0.85rem;
  color: var(--gris);
  margin-bottom: 18px;
}

#contenu-cantique .refrain {
  background: #fff8e6;
  border-left: 4px solid var(--or);
  padding: 12px 14px;
  border-radius: 8px;
  margin-bottom: 18px;
  font-style: italic;
}

#contenu-cantique .refrain .label {
  font-weight: 600;
  font-style: normal;
  color: var(--bleu);
  font-size: 0.8rem;
  margin-bottom: 6px;
  display: block;
}

#contenu-cantique .couplet {
  margin-bottom: 16px;
}

#contenu-cantique .couplet .num {
  font-weight: 600;
  color: var(--or);
  margin-bottom: 4px;
  font-size: 0.9rem;
}

#contenu-cantique .couplet .ligne {
  line-height: 1.5;
  margin-bottom: 2px;
}

#contenu-cantique .actions {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--bord);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

#contenu-cantique .actions button {
  padding: 10px 16px;
  border: 1px solid var(--bord);
  background: #fff;
  border-radius: 8px;
  font-size: 0.9rem;
  cursor: pointer;
}

</style>
</head>
<body>

  <header class="topbar">
    <button id="btn-retour" class="btn-retour" hidden>←</button>
    <h1 id="titre-app">Cantiques EUJC</h1>
  </header>

  <main id="vue-liste">
    <div class="barre-recherche">
      <input id="recherche" type="search" placeholder="Rechercher un cantique…" autocomplete="off">
    </div>

    <div class="filtres">
      <select id="filtre-type">
        <option value="">Tous les types</option>
        <option value="louange">Louange</option>
        <option value="priere">Prière</option>
      </select>
      <select id="filtre-lecon">
        <option value="">Toutes les leçons</option>
        <option value="creation">Création</option>
        <option value="noe">Noé</option>
        <option value="abraham">Abraham</option>
      </select>
    </div>

    <ul id="liste-cantiques" class="liste"></ul>

    <p id="liste-vide" class="vide" hidden>Aucun cantique trouvé.</p>
  </main>

  <main id="vue-cantique" hidden>
    <article id="contenu-cantique"></article>
  </main>

<script>
// ============================================================
// Cantiques EUJC — application PWA
// ============================================================

const etat = {
  cantiques: [],
  filtreTexte: '',
  filtreType: '',
  filtreLecon: '',
  cantiqueCourant: null
};

const $liste = document.getElementById('liste-cantiques');
const $vide = document.getElementById('liste-vide');
const $recherche = document.getElementById('recherche');
const $filtreType = document.getElementById('filtre-type');
const $filtreLecon = document.getElementById('filtre-lecon');
const $vueListe = document.getElementById('vue-liste');
const $vueCantique = document.getElementById('vue-cantique');
const $contenu = document.getElementById('contenu-cantique');
const $btnRetour = document.getElementById('btn-retour');
const $titreApp = document.getElementById('titre-app');

async function chargerCantiques() {
  try {
    const data = JSON.parse(document.getElementById('data-cantiques').textContent);
    etat.cantiques = data.cantiques || [];
    afficherListe();
  } catch (err) {
    $liste.innerHTML = '';
    $vide.hidden = false;
    $vide.textContent = 'Erreur de chargement : ' + err.message;
  }
}

function normaliser(texte) {
  return (texte || '').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function versionFr(cantique) {
  return cantique.versions.find(v => v.langue === 'fr') || cantique.versions[0];
}

function echapper(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function afficherListe() {
  const q = normaliser(etat.filtreTexte);
  const resultats = etat.cantiques.filter(c => {
    if (etat.filtreType && c.type !== etat.filtreType) return false;
    if (etat.filtreLecon && c.lecon !== etat.filtreLecon) return false;
    if (!q) return true;
    return c.versions.some(v => {
      const texte = normaliser(
        [v.titre]
          .concat(v.refrain || [])
          .concat((v.couplets || []).flatMap(cp => cp.lignes || []))
          .join(' ')
      );
      return texte.includes(q);
    });
  });

  $liste.innerHTML = '';
  if (resultats.length === 0) {
    $vide.hidden = false;
    return;
  }
  $vide.hidden = true;

  resultats.forEach(c => {
    const v = versionFr(c);
    const li = document.createElement('li');
    li.dataset.id = c.id;
    const titres = c.versions.map(x => x.titre).filter(Boolean);
    const titreAffiche = (v && v.titre) || titres[0] || '(sans titre)';
    const metaParts = [];
    if (c.type) metaParts.push('<span class="badge">' + echapper(c.type) + '</span>');
    if (c.lecon) metaParts.push('<span class="badge">' + echapper(c.lecon) + '</span>');
    const langues = c.versions.map(x => x.langue.toUpperCase()).join(' · ');
    metaParts.push('<span>' + langues + '</span>');
    li.innerHTML = '<div class="titre">' + echapper(titreAffiche) + '</div>'
                 + '<div class="meta">' + metaParts.join('') + '</div>';
    li.addEventListener('click', () => ouvrirCantique(c.id));
    $liste.appendChild(li);
  });
}

function ouvrirCantique(id) {
  const c = etat.cantiques.find(x => x.id === id);
  if (!c) return;
  etat.cantiqueCourant = c;
  const v = versionFr(c);
  const titres = c.versions.map(x => x.titre).filter(Boolean);
  const titreAffiche = (v && v.titre) || titres[0] || '(sans titre)';

  let html = '<h2>' + echapper(titreAffiche) + '</h2>';
  html += '<div class="meta-cantique">';
  if (c.type) html += 'Type : ' + echapper(c.type) + ' · ';
  if (c.lecon) html += 'Leçon : ' + echapper(c.lecon) + ' · ';
  html += 'Langues : ' + c.versions.map(x => x.langue.toUpperCase()).join(', ');
  html += '</div>';

  if (v && v.refrain && v.refrain.length) {
    html += '<div class="refrain"><span class="label">Refrain</span>';
    html += v.refrain.map(l => '<div class="ligne">' + echapper(l) + '</div>').join('');
    html += '</div>';
  }
  if (v && v.couplets) {
    v.couplets.forEach(cp => {
      html += '<div class="couplet">';
      html += '<div class="num">' + cp.ordre + '</div>';
      html += (cp.lignes || []).map(l => '<div class="ligne">' + echapper(l) + '</div>').join('');
      html += '</div>';
    });
  }
  if (c.versions.length > 1) {
    html += '<div class="actions"><button disabled>Autres langues (à venir)</button></div>';
  }

  $contenu.innerHTML = html;
  $vueListe.hidden = true;
  $vueCantique.hidden = false;
  $btnRetour.hidden = false;
  $titreApp.textContent = titreAffiche;
  window.scrollTo(0, 0);
}

function fermerCantique() {
  etat.cantiqueCourant = null;
  $vueCantique.hidden = true;
  $vueListe.hidden = false;
  $btnRetour.hidden = true;
  $titreApp.textContent = 'Cantiques EUJC';
  window.scrollTo(0, 0);
}

$recherche.addEventListener('input', e => {
  etat.filtreTexte = e.target.value;
  afficherListe();
});
$filtreType.addEventListener('change', e => {
  etat.filtreType = e.target.value;
  afficherListe();
});
$filtreLecon.addEventListener('change', e => {
  etat.filtreLecon = e.target.value;
  afficherListe();
});
$btnRetour.addEventListener('click', fermerCantique);

chargerCantiques();

</script>
<script src="sw-register.js?v=8"></script>
</body>
</html>
