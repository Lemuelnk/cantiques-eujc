name: Flutter Build APK

on:
  push:
    branches: [ "main", "ci/flutter-build-apk" ]
  pull_request:
    branches: [ "main", "ci/flutter-build-apk" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Generate Android platform
        working-directory: flutter_app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze code (non-bloquant)
        working-directory: flutter_app
        continue-on-error: true
        run: flutter analyze

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cantiques-eujc-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
