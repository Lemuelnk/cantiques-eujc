name: Flutter Build APK

on:
  push:
    branches: [ "main", "ci/flutter-build-apk" ]
  pull_request:
    branches: [ "main", "ci/flutter-build-apk" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze code (non-bloquant)
        working-directory: flutter_app
        continue-on-error: true
        run: flutter analyze

      - name: Setup signing
        working-directory: flutter_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          chmod 600 key.properties app/upload-keystore.jks
          echo "Keystore bytes: $(wc -c < app/upload-keystore.jks)"

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: cantiques-eujc-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Verify APK signature
        working-directory: flutter_app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner introuvable, skip"; exit 0; fi
          "$APKSIGNER" verify --print-certs "$APK" | head -10

