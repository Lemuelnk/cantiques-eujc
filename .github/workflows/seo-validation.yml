name: SEO validation

on:
  pull_request:
  push:
    branches:
      - main
      - "seo/**"

jobs:
  validate-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SEO page generation
        run: |
          python3 scripts/generate_seo_pages.py
          python3 scripts/validate_seo.py
