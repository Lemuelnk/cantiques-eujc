name: Android Build APK (Kotlin native)

on:
  push:
    branches: [ "main" ]
    tags:
      - "android-v*"
    paths:
      - 'android_native/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'android_native/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup signing
        working-directory: android_native
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required GitHub Actions secret is missing: ${secret_name}"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          test -s app/upload-keystore.jks

          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > key.properties

          chmod 600 key.properties app/upload-keystore.jks
          echo "Android signing files prepared successfully."

      - name: Make gradlew executable
        working-directory: android_native
        run: chmod +x ./gradlew || true

      - name: Build Release APK
        working-directory: android_native
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: android_native
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "APK release introuvable"; exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -10
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: cantiques-eujc-release-apk
          path: android_native/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Publish APK to GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('android-v1.0.0-build.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Cantiques EUJC Android ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('v1.0.0 build {0}', github.run_number) }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: android_native/app/build/outputs/apk/release/app-release.apk
